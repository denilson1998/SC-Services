apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apidelivery
  namespace: "#{{Namespace}}#"
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399, 404"
  labels:
    name: apidelivery-service
spec:
  tls:
  - hosts:
    - "#{{SpecTlsHostApiDelivery}}#"
    secretName: sitec-generic
  rules:
  - host: "#{{SpecTlsHostApiDelivery}}#"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: apidelivery-service
            port: 
              number: 8080 
---
