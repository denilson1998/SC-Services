  #   image: ${REGISTRY:-peto}/webstatus:${TAG:-latest}
  #   build:
  #     context: .
  #     dockerfile: src/WebStatus/Dockerfile
  #   environment:
  #     - ASPNETCORE_URLS=http://0.0.0.0:80
  #     - HealthChecksUI__HealthChecks__0__Name=Payments API
